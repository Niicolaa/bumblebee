version: 2

project_name: bumblebee

before:
  hooks:
    - go mod tidy

builds:
  - id: bumblebee
    main: ./cmd/bumblebee
    binary: bumblebee
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Tag}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: bumblebee
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      bumblebee_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - threat_intel/**

  # Raw, un-archived binaries alongside the tarballs. Fetchers that pull
  # a single file by URL and verify a hash — Velociraptor tool
  # definitions, MDM payloads, container builds — cannot unpack a
  # tar.gz, so they need the binary itself as a release asset.
  #
  # This is deliberately a separate archive rather than a replacement:
  # the tarballs carry LICENSE, README, and a threat_intel snapshot,
  # which is the right artifact for a human doing a manual install.
  # `files:` is ignored for the binary format, so the raw assets are the
  # executable and nothing else.
  - id: raw-binary
    formats:
      - binary
    name_template: >-
      bumblebee_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: true
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
